name: ragmatch-quality
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragmatch_quality
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quality-admin-only
    ports: ["127.0.0.1:18439:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ragmatch_quality"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: ragmatch-quality-api
    build:
      context: ..
      dockerfile: qa/Dockerfile
      args:
        API_IMAGE: ${QA_API_IMAGE:-ragmatch-api:qa}
    environment:
      DATABASE_URL: postgresql://ragmatch_quality:quality-runtime-only@db:5432/ragmatch_quality
      QA_ADMIN_DATABASE_URL: postgresql://postgres:quality-admin-only@db:5432/ragmatch_quality
      APP_DB_USER: ragmatch_quality
      APP_DB_PASSWORD: quality-runtime-only
      APP_ENV: production
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: "1"
      SECRET_KEY: quality-only-signing-key-never-use-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,api,testserver
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:13089,http://localhost:13089
      AUTH_COOKIE_SECURE: "0"
      AUTH_TOKEN_IN_BODY: "0"
      REGISTER_ENABLED: "0"
      AI_FEATURES_ENABLED: "0"
      OLLAMA_AUTO_PULL: "0"
      OBJECT_STORAGE_ENABLED: "0"
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ""
      CONLICITACAO_ENABLED: "0"
      MARKET_INTELLIGENCE_ENABLED: "true"
      BACKEND_LOG_DIR: /tmp/backend-logs
      QA_REPORT_DIR: /reports
    volumes: ["quality_reports:/reports"]
    ports: ["127.0.0.1:18089:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
    stop_grace_period: 30s
  frontend:
    image: ${QA_FRONTEND_IMAGE:-ragmatch-frontend:qa}
    ports: ["127.0.0.1:13089:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  quality_reports:
