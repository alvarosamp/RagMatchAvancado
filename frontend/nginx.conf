server {
  listen 80;
  client_max_body_size 50M;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $api_upstream api:8000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /crm {
    return 301 /crm/;
  }

  # SPA entrypoints must always be revalidated. Hashed assets remain immutable,
  # but caching index.html can make an open tab request chunks removed by a deploy.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location = /crm/index.html {
    expires -1;
    try_files $uri =404;
  }

  location /crm/ {
    try_files $uri $uri/ /crm/index.html;
  }

  # An already-open SPA can still request a hashed JS chunk removed by a deploy.
  # Serve a small recovery module so the stale tab reloads the current entrypoint.
  location = /crm/chunk-reload.js {
    expires -1;
    try_files $uri =404;
  }

  location ~* ^/crm/assets/.*\.js$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri /crm/chunk-reload.js;
  }

  location ~* ^/(assets|crm/assets)/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
  }
}
