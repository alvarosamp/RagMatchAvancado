name: ragmatch-technical-preview
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragmatch_quality
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quality-admin-only
    volumes: [preview_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ragmatch_quality']
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
  api:
    image: ragmatch-technical-preview-api:local
    environment:
      DATABASE_URL: postgresql://ragmatch_quality:quality-runtime-only@db:5432/ragmatch_quality
      QA_ADMIN_DATABASE_URL: postgresql://postgres:quality-admin-only@db:5432/ragmatch_quality
      APP_DB_USER: ragmatch_quality
      APP_DB_PASSWORD: quality-runtime-only
      APP_ENV: production
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: '1'
      SECRET_KEY: quality-only-signing-key-never-use-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CSRF_TRUSTED_ORIGINS: http://localhost:13089,http://127.0.0.1:13089
      AUTH_COOKIE_SECURE: '0'
      AUTH_COOKIE_NAME: technical_preview_token
      AUTH_TOKEN_IN_BODY: '0'
      REGISTER_ENABLED: '0'
      AI_FEATURES_ENABLED: '0'
      OLLAMA_AUTO_PULL: '0'
      OBJECT_STORAGE_ENABLED: '0'
      REDIS_URL: redis://redis:6379/0
      BACKEND_LOG_DIR: /tmp/backend-logs
      QA_REPORT_DIR: /reports
      MARKET_INTELLIGENCE_ENABLED: 'true'
      EMAIL_MONITOR_ENABLED: '0'
      CONLICITACAO_ENABLED: '0'
    volumes: [preview_reports:/reports, preview_data:/data]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 60
  frontend:
    image: ragmatch-technical-preview-frontend:local
    ports: ['127.0.0.1:13089:80']
    depends_on:
      api: {condition: service_healthy}
volumes:
  preview_db:
  preview_reports:
  preview_data:
