# Production overlay, after docker-compose.prod.yaml and docker-compose.analytics.yaml.
# Reuse the operational database network and wait for runtime role grants.
services:
  worker-data:
    networks: [app-internal]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
  data-scheduler:
    # CRM dashboards and supplier views follow portal updates automatically.
    profiles: !reset []
    networks: [app-internal]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
  metabase-market:
    networks: [app-internal]
