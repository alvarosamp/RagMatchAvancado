# Overlay: docker compose -f docker-compose.yaml -f docker-compose.analytics.yaml ...
services:
  api:
    environment:
      MARKET_INTELLIGENCE_ENABLED: ${MARKET_INTELLIGENCE_ENABLED:-true}
      MARKET_BLING_ANALYTICS_ENABLED: ${MARKET_BLING_ANALYTICS_ENABLED:-false}
      MARKET_BLING_COMPANY_MAP: ${MARKET_BLING_COMPANY_MAP:-}
      MARKET_DEFLATOR_SERIES: ${MARKET_DEFLATOR_SERIES:-}
      MARKET_DEFLATOR_BASE_MONTH: ${MARKET_DEFLATOR_BASE_MONTH:-}
  worker-data:
    image: ${MARKET_WORKER_IMAGE:-ragmatch-market-worker:local}
    build:
      context: .
      dockerfile: analytics/Dockerfile
    restart: unless-stopped
    environment:
      MARKET_INTELLIGENCE_ENABLED: ${MARKET_INTELLIGENCE_ENABLED:-true}
      MARKET_BLING_ANALYTICS_ENABLED: ${MARKET_BLING_ANALYTICS_ENABLED:-false}
      DATABASE_URL: ${MARKET_DATABASE_URL:?Set restricted MARKET_DATABASE_URL}
      MARKET_TENANT_IDS: ${MARKET_TENANT_IDS:?Set authorized tenant IDs}
      BLING_CREDENTIALS_ENCRYPTION_KEY: ${BLING_CREDENTIALS_ENCRYPTION_KEY:-}
      MLFLOW_TRACKING_URI: ${MARKET_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      GIT_SHA: ${GIT_SHA:-unknown}
      PREFECT_HOME: /tmp/.prefect
      MARKET_DBT_ENABLED: ${MARKET_DBT_ENABLED:-false}
      MARKET_DB_HOST: ${MARKET_DB_HOST:-db}
      MARKET_DB_PORT: ${MARKET_DB_PORT:-5432}
      MARKET_DB_USER: ${MARKET_DB_USER:-market_transform}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:-}
      MARKET_DB_NAME: ${MARKET_DB_NAME:-ragmatch}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=10001,gid=10001
  data-scheduler:
    image: ${MARKET_WORKER_IMAGE:-ragmatch-market-worker:local}
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: [analytics-schedule]
    restart: unless-stopped
    environment:
      MARKET_INTELLIGENCE_ENABLED: ${MARKET_INTELLIGENCE_ENABLED:-true}
      MARKET_BLING_ANALYTICS_ENABLED: ${MARKET_BLING_ANALYTICS_ENABLED:-false}
      DATABASE_URL: ${MARKET_DATABASE_URL:?Set restricted MARKET_DATABASE_URL}
      MARKET_TENANT_IDS: ${MARKET_TENANT_IDS:?Set authorized tenant IDs}
      PREFECT_HOME: /tmp/.prefect
      PREFECT_API_URL: ${PREFECT_API_URL:-}
      MARKET_SCHEDULE_SECONDS: ${MARKET_SCHEDULE_SECONDS:-3600}
      MARKET_SCHEDULE_SOURCES: ${MARKET_SCHEDULE_SOURCES:-crm}
    command: [python, -m, analytics.flows.pipeline, --schedule]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:size=512m,uid=10001,gid=10001"]
  metabase-market:
    image: metabase/metabase:v0.56.6
    profiles: [analytics-bi]
    restart: unless-stopped
    ports: ["127.0.0.1:3030:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: ${METABASE_DB_HOST:?Set separate Metabase application DB host}
      MB_DB_PORT: ${METABASE_DB_PORT:-5432}
      MB_DB_DBNAME: ${METABASE_DB_NAME:?Set Metabase application database}
      MB_DB_USER: ${METABASE_DB_USER:?Set Metabase application database user}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set Metabase application database password}
    mem_limit: 1g
