services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edital_matcher}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
      DB_NAME: ${POSTGRES_DB:-edital_matcher}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edital_matcher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  api:
    image: alvarocareli/ragmatch-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ${TOR_DOCUMENTS_HOST_PATH:-./data/documents}:/documents
      - ./overrides/main.py:/app/app/main.py:ro
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-edital_matcher}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatório}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório}
      S3_BUCKET: ${S3_BUCKET:-edital-matcher}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_AUTO_PULL: "0"
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED:-0}
      DATASHEET_EXTRACTOR_USE_LLM: ${DATASHEET_EXTRACTOR_USE_LLM:-0}
      CRM_MATCH_USE_LLM: ${CRM_MATCH_USE_LLM:-0}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-0}
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_HOSTS: ${API_DOMAIN:?API_DOMAIN obrigatorio}
      CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN obrigatorio}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-access_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_TOKEN_IN_BODY: ${AUTH_TOKEN_IN_BODY:-0}
      MAX_PDF_UPLOAD_BYTES: ${MAX_PDF_UPLOAD_BYTES:-52428800}
      MAX_DOCUMENT_UPLOAD_BYTES: ${MAX_DOCUMENT_UPLOAD_BYTES:-52428800}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TOR_DOCUMENTS_ROOT: /documents
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ollama-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.ragmatch-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.ragmatch-api.entrypoints=websecure"
      - "traefik.http.routers.ragmatch-api.tls=true"
      - "traefik.http.routers.ragmatch-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.ragmatch-api.loadbalancer.server.port=8000"
    networks:
      - app-internal
      - traefik-proxy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    image: alvarocareli/ragmatch-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ${TOR_DOCUMENTS_HOST_PATH:-./data/documents}:/documents
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatório}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório}
      S3_BUCKET: ${S3_BUCKET:-edital-matcher}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED:-0}
      DATASHEET_EXTRACTOR_USE_LLM: ${DATASHEET_EXTRACTOR_USE_LLM:-0}
      CRM_MATCH_USE_LLM: ${CRM_MATCH_USE_LLM:-0}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TOR_DOCUMENTS_ROOT: /documents
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ollama-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: dramatiq app.jobs.tasks --queues edital-processing,matching --processes 1 --threads ${WORKER_THREADS:-2}
    networks:
      - app-internal

  worker-ai:
    image: alvarocareli/ragmatch-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ${TOR_DOCUMENTS_HOST_PATH:-./data/documents}:/documents
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatório}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório}
      S3_BUCKET: ${S3_BUCKET:-edital-matcher}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED:-0}
      CRM_MATCH_USE_LLM: ${CRM_MATCH_USE_LLM:-0}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TOR_DOCUMENTS_ROOT: /documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ollama-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: dramatiq app.jobs.tasks --queues ai-inference --processes ${AI_WORKER_PROCESSES:-1} --threads ${AI_WORKER_THREADS:-1}
    networks:
      - app-internal

  scheduler:
    image: alvarocareli/ragmatch-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
      PNCP_RADAR_AUTO_REFRESH: ${PNCP_RADAR_AUTO_REFRESH:-1}
      PNCP_RADAR_REFRESH_INTERVAL_SECONDS: ${PNCP_RADAR_REFRESH_INTERVAL_SECONDS:-86400}
      EMAIL_MONITOR_ENABLED: ${EMAIL_MONITOR_ENABLED:-0}
      EMAIL_MONITOR_IMAP_HOST: ${EMAIL_MONITOR_IMAP_HOST:-}
      EMAIL_MONITOR_IMAP_USER: ${EMAIL_MONITOR_IMAP_USER:-}
      EMAIL_MONITOR_IMAP_PASSWORD: ${EMAIL_MONITOR_IMAP_PASSWORD:-}
      JOB_RECOVERY_INTERVAL_SECONDS: ${JOB_RECOVERY_INTERVAL_SECONDS:-60}
      JOB_PENDING_REQUEUE_SECONDS: ${JOB_PENDING_REQUEUE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-7200}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.scheduler
    networks:
      - app-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatório}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório}
    command: server /data
    volumes:
      - minio_data:/data
    networks:
      - app-internal

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app-internal

  ollama-setup:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      /bin/sh -ec 'ollama pull "$OLLAMA_EMBED_MODEL" && ollama pull "$OLLAMA_MODEL"'
    networks:
      - app-internal

  migrate:
    image: alvarocareli/ragmatch-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - app-internal

  frontend:
    image: alvarocareli/ragmatch-frontend:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.ragmatch-frontend.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.ragmatch-frontend.entrypoints=websecure"
      - "traefik.http.routers.ragmatch-frontend.tls=true"
      - "traefik.http.routers.ragmatch-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ragmatch-frontend.loadbalancer.server.port=80"
    depends_on:
      - api

  mlflow:
    image: alvarocareli/ragmatch-mlflow:${IMAGE_TAG:?IMAGE_TAG obrigatorio (use sha-<commit> publicado pelo CI)}
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns/artifacts
    volumes:
      - mlflow_data:/mlruns
    command: >
      mlflow server
        --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edital_matcher}
        --default-artifact-root /mlruns/artifacts
        --host 0.0.0.0
        --port 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-internal

volumes:
  postgres_data:
  mlflow_data:
  redis_data:
  minio_data:
  ollama_data:

networks:
  app-internal:
    driver: bridge
  traefik-proxy:
    external: true
    name: traefik-proxy
