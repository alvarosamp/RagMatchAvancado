services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: edital_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./data:/data
      - D:/TOR/Documentos:/tor-documentos
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/edital_matcher
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: edital-matcher
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_AUTO_PULL: "1"
      WATCHFILES_FORCE_POLLING: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-troque-em-producao}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TOR_DOCUMENTS_ROOT: /tor-documentos
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./data:/data
      - D:/TOR/Documentos:/tor-documentos
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/edital_matcher
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: edital-matcher
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TOR_DOCUMENTS_ROOT: /tor-documentos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: dramatiq app.jobs.tasks --processes 1 --threads 2

  scheduler:
    build: ./backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/edital_matcher
      PNCP_RADAR_AUTO_REFRESH: ${PNCP_RADAR_AUTO_REFRESH:-1}
      PNCP_RADAR_REFRESH_INTERVAL_SECONDS: ${PNCP_RADAR_REFRESH_INTERVAL_SECONDS:-86400}
      EMAIL_MONITOR_ENABLED: ${EMAIL_MONITOR_ENABLED:-0}
      EMAIL_MONITOR_IMAP_HOST: ${EMAIL_MONITOR_IMAP_HOST:-}
      EMAIL_MONITOR_IMAP_USER: ${EMAIL_MONITOR_IMAP_USER:-}
      EMAIL_MONITOR_IMAP_PASSWORD: ${EMAIL_MONITOR_IMAP_PASSWORD:-}
      JOB_RECOVERY_INTERVAL_SECONDS: ${JOB_RECOVERY_INTERVAL_SECONDS:-60}
      JOB_PENDING_REQUEUE_SECONDS: ${JOB_PENDING_REQUEUE_SECONDS:-60}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-7200}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.scheduler

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio_data:/data

  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/edital_matcher
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  bid-buddy:
    build:
      context: ./bid-buddy
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        ollama pull nomic-embed-text &&
        ollama pull llama3.2:1b
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:postgres@db:5432/edital_matcher
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns/artifacts
    volumes:
      - mlflow_data:/mlruns
    command: >
      mlflow server
        --backend-store-uri postgresql://postgres:postgres@db:5432/edital_matcher
        --default-artifact-root /mlruns/artifacts
        --host 0.0.0.0
        --port 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  mlflow_data:
  redis_data:
  minio_data:
