name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  PYTHONPATH: backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint
  # Verifica estilo de código com ruff — falha rápida antes de rodar testes.
  # ruff é 10-100x mais rápido que flake8 e cobre mais regras.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/app --select E,F,W,I --output-format=github

      - name: Lint testes
        run: ruff check tests mlops/scripts --select E,F,W,I --output-format=github

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Testes unitários
  # Roda sem Ollama, PostgreSQL ou MLflow (tudo mockado).
  # Gera relatório de cobertura e salva como artefato.
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar testes unitários
        run: |
          pytest tests/unit \
                 tests/test_password_policy.py \
                 tests/test_requirements.py \
                 -v \
                 --tb=short \
                 --cov=backend/app \
                 --cov-report=xml \
                 --cov-report=term-missing

      - name: Fazer upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build Docker
  # Verifica que as imagens constroem sem erros.
  # Não faz push (só verifica integridade do Dockerfile).
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build imagem da API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ragmatch-api:ci

      - name: Build imagem do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ragmatch-frontend:ci
