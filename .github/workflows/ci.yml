name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publicar imagens no Docker Hub (latest + sha)"
        type: boolean
        required: true
        default: false
      deploy_vps:
        description: "Fazer deploy na VPS depois da publicacao"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: backend
  SECRET_KEY: test-secret-ci
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOCKERHUB_NAMESPACE: alvarocareli

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check Python for runtime errors
        run: ruff check backend/app tests/integration --select F --output-format=github

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run unit tests with coverage
        run: |
          mkdir -p test-results
          pytest tests/unit \
                 tests/test_password_policy.py \
                 tests/test_requirements.py \
                 -v \
                 --tb=short \
                 --junitxml=test-results/unit.xml \
                 --cov=backend/app \
                 --cov-fail-under=35 \
                 --cov-report=xml \
                 --cov-report=term-missing
      - name: Upload backend unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-reports
          path: |
            coverage.xml
            test-results/unit.xml
          if-no-files-found: warn

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run HTTP integration tests
        run: |
          mkdir -p test-results
          pytest tests/integration -v --tb=short --junitxml=test-results/integration.xml
      - name: Upload backend integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-report
          path: test-results/integration.xml
          if-no-files-found: warn

  frontend-tests-build:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check embedded CRM assets
        run: test -f frontend/public/crm/index.html
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  docker-build:
    name: Docker Packaging
    runs-on: ubuntu-latest
    needs:
      - backend-unit-tests
      - backend-integration-tests
      - frontend-tests-build
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: ragmatch-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: ragmatch-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image_name: ragmatch-mlflow
            context: ./mlflow
            dockerfile: ./mlflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image_name }} without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image_name }}:ci
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
      - name: Smoke test ${{ matrix.image_name }} image
        run: |
          case "${{ matrix.image_name }}" in
            ragmatch-api)
              docker run --rm \
                -e DATABASE_URL=postgresql://postgres:postgres@db:5432/test \
                -e SECRET_KEY=test-secret-ci \
                ragmatch-api:ci \
                python -c "from app.main import app; print(app.title)"
              ;;
            ragmatch-frontend)
              docker run --rm ragmatch-frontend:ci nginx -t
              ;;
            ragmatch-mlflow)
              docker run --rm ragmatch-mlflow:ci mlflow --version
              ;;
          esac

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-unit-tests
      - backend-integration-tests
      - frontend-tests-build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    timeout-minutes: 45
    concurrency:
      group: dockerhub-${{ matrix.image_name }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: ragmatch-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: ragmatch-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image_name: ragmatch-mlflow
            context: ./mlflow
            dockerfile: ./mlflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  verify-published-images:
    name: Verify Published Docker Images
    runs-on: ubuntu-latest
    needs: publish-images
    timeout-minutes: 10
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Show the Hostinger deployment tag
        run: |
          {
            echo "## Hostinger deployment tag"
            echo '```env'
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the deploy tag for every service
        run: |
          set -euo pipefail
          for image in ragmatch-api ragmatch-frontend ragmatch-mlflow; do
            reference="${DOCKERHUB_NAMESPACE}/${image}:${IMAGE_TAG}"
            echo "Checking ${reference}"
            docker manifest inspect "${reference}" >/dev/null
          done
      - name: Verify latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for image in ragmatch-api ragmatch-frontend ragmatch-mlflow; do
            reference="${DOCKERHUB_NAMESPACE}/${image}:latest"
            echo "Checking ${reference}"
            docker manifest inspect "${reference}" >/dev/null
          done

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: verify-published-images
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && inputs.deploy_vps
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Gate deploy (requires VPS secrets)
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -e
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_APP_DIR" ] || missing="$missing VPS_APP_DIR"
          if [ -n "$missing" ]; then
            echo "Deploy skipped; missing secrets:$missing"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy stack on VPS
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          DEPLOY_BRANCH: main
          IMAGE_TAG: sha-${{ github.sha }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR}' && DEPLOY_BRANCH='${DEPLOY_BRANCH}' IMAGE_TAG='${IMAGE_TAG}' bash scripts/deploy-production.sh"
