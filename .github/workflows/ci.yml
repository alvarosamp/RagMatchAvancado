name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Buildar e publicar imagens no Docker Hub (latest + sha)"
        required: true
        default: "false"
      deploy_vps:
        description: "Fazer deploy na VPS (requer VPS_* secrets)"
        required: true
        default: "false"

permissions:
  contents: read

env:
  PYTHONPATH: backend
  SECRET_KEY: test-secret-ci
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOCKERHUB_NAMESPACE: alvarocareli

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lint dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Ruff
        run: ruff check backend/app --select F --output-format=github

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: |
          pytest tests/unit \
                 tests/test_password_policy.py \
                 tests/test_requirements.py \
                 -v \
                 --tb=short \
                 --cov=backend/app \
                 --cov-report=xml \
                 --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check embedded CRM assets
        run: test -f frontend/public/crm/index.html

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ragmatch-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ragmatch-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MLflow image
        uses: docker/build-push-action@v6
        with:
          context: ./mlflow
          push: false
          tags: ragmatch-mlflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - docker-build
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_images == 'true')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: ragmatch-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: ragmatch-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image_name: ragmatch-mlflow
            context: ./mlflow
            dockerfile: ./mlflow/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: publish-images
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_vps == 'true')
      )
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Gate deploy (requires VPS secrets)
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -e
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_APP_DIR" ] || missing="$missing VPS_APP_DIR"

          if [ -n "$missing" ]; then
            echo "Deploy skipped; missing secrets:$missing"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy stack on VPS
        if: steps.gate.outputs.should_deploy == 'true'
        env:
          DEPLOY_BRANCH: main
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR}' && DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash scripts/deploy-production.sh"
